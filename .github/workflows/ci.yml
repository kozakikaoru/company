name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck plugins/company/scripts/*.sh

  hook-tests:
    name: Hook behavior tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: bash tests/hook_tests.sh

  json-lint:
    name: JSON lint & version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and version sync
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open('plugins/company/.claude-plugin/plugin.json'))
          m = json.load(open('.claude-plugin/marketplace.json'))
          assert p['version'] == m['version'] == m['plugins'][0]['version'], \
              f"version mismatch: plugin={p['version']} marketplace={m['version']} plugins[0]={m['plugins'][0]['version']}"
          print(f"OK: all versions are {p['version']}")
          PY
